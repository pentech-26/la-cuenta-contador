body{margin:0;min-height:100vh;background:none;color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,.num{font-family:"Trebuchet MS",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
button.sec{background:transparent}
header{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;margin-bottom:12px}
h1{font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-size:clamp(38px,10vw,54px);font-weight:400;letter-spacing:1px;line-height:1.05;margin:0;text-align:center;color:#000;text-shadow:3px 3px 0 rgba(255,255,255,.75)}
.sub{display:inline-block;margin-top:6px;font-size:21px;font-weight:800;color:#000;background:var(--gold);border-radius:99px;padding:5px 16px;box-shadow:0 2px 6px rgba(150,70,0,.2)}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tools button.sec{background:#fff;border:2px solid #e2b873;font-weight:700;box-shadow:0 2px 6px rgba(150,70,0,.22)}
.tools button.sec:disabled{opacity:.65}
.bill{box-shadow:0 4px 14px rgba(150,70,0,.15);background:var(--card);border:2px solid var(--acc);border-radius:16px;padding:14px;margin-bottom:14px}
.bt{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.num{font-size:34px;font-weight:800;line-height:1}
small{color:var(--mut);font-size:13px}
.items{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:10px}
.items span.grp{background:var(--gold);border:2px solid #d99a00;font-weight:800;color:#000;padding:2px 10px}
.items span{background:var(--bg);border-radius:99px;padding:3px 10px;font-size:13px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.chips button{padding:8px 0;font-weight:700}
.ch4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.row button{flex:1 1 auto}
.row input{flex:1 1 90px;min-width:0}
input[type=number],input[type=text]{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.cnt{display:flex;align-items:center;gap:6px}
.cw{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.cw button{width:100%;min-width:0;white-space:nowrap;padding:8px 6px}
.bill{background-color:#ececea;background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='240'%20height='240'%3E%3Cfilter%20id='g'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.75'%20numOctaves='3'%20seed='4'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.35%20%200%200%200%200%200.35%20%200%200%200%200%200.35%20%200%200%200%200.55%20-0.2'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url%28%23g%29'/%3E%3C/svg%3E"),url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='320'%20height='320'%3E%3Cfilter%20id='f'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.02%200.06'%20numOctaves='2'%20seed='9'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.45%20%200%200%200%200%200.45%20%200%200%200%200%200.45%20%200%200%200%200.35%20-0.12'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url%28%23f%29'/%3E%3C/svg%3E"),linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 40%)}
.bt{margin-bottom:8px;gap:10px}
.tot{flex:1 1 200px;background:var(--gold);border-radius:14px;padding:8px 14px;box-shadow:0 2px 8px rgba(150,70,0,.2)}
.st{display:block;font-size:16px;font-weight:800;color:#000;margin-top:4px}
.tl{display:block;font-size:17px;font-weight:700;color:#000}
.tot .num{font-size:58px;line-height:1.05;color:#000}
.tot .num,.p .num{font-family:"Share Tech Mono","DejaVu Sans Mono",Menlo,Consolas,"Courier New",monospace;font-weight:400;letter-spacing:-1px;-webkit-text-stroke:1.4px currentColor}
.tot .num{font-size:58px}
.p .num{font-size:48px}
.cl{font-size:17px;font-weight:700}
.hn{display:block;width:0;min-width:100%;text-align:center;font-size:12px;line-height:1.25}
.cnt button{min-height:36px;padding:4px 12px}
.ok{color:#15803d;font-weight:800}
.go{color:#15803d;font-weight:800;font-size:15px}
.nogo{color:#b91c1c;font-weight:800;font-size:15px}
.ic{font-size:1.5em;line-height:1;vertical-align:-.14em;margin-right:.18em}
h1 .ic{font-size:1.2em}
.logo{height:1.35em;width:1.35em;object-fit:contain;vertical-align:-.28em;margin-right:.18em}
.chips button .ic,.cnt button .ic{margin:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.p{box-shadow:0 3px 10px rgba(150,70,0,.12);background:var(--card);border:1px solid var(--line);border-top:8px solid var(--pc,var(--acc));border-radius:14px;padding:12px}
.p.starter{box-shadow:0 0 0 3px var(--gold)}
.name{font-weight:700;font-size:18px;background:transparent;border:0;border-bottom:1px dashed var(--line);color:inherit;width:100%;padding:2px 0}
.p .num{margin:4px 0 2px;line-height:1.05}
.dl{display:block;margin-top:8px;font-size:17px;font-weight:700;color:#000}
.neg{color:var(--warn)}
.mano{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--bg);border:3px solid var(--pc,var(--acc));border-radius:14px;padding:6px 12px}
.mano.plus{background:var(--gold)}
.mn{font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-size:40px;line-height:1;color:#000}
.ml{font-size:17px;font-weight:700;color:#000}
.tag{font-size:13px;background:var(--gold);color:#1b1b1b;border-radius:99px;padding:2px 10px;font-weight:700;display:inline-block}
.end{background:var(--gold);color:#1b1b1b;border-radius:14px;padding:12px 16px;margin-bottom:12px}.end h2{margin:0 0 4px}.end p{margin:2px 0}
section{margin-top:20px}
h2{font-size:20px;margin:0 0 8px}
.rank{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.rank div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.rank div:last-child{border:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.setup{max-width:480px;margin:0 auto}
.setup label{display:block;margin:12px 0 4px;color:var(--mut)}
.setup .r6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.r6 button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.hint{color:var(--mut);font-size:14px}
.gate .card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px;box-shadow:0 4px 14px rgba(150,70,0,.15)}
.gate label{margin:0 0 6px;color:#000;font-weight:700;font-size:17px}
.gate .or{text-align:center;margin:12px 0;font-weight:700}
.err{color:#b91c1c;font-weight:700;min-height:1.3em;margin:8px 0}
.legal{max-width:1000px;margin:8px auto 0;padding:14px 16px 28px;border-top:1px solid var(--line);font-size:12px;line-height:1.45;text-align:center;color:#000}
.legal p{margin:0 0 4px}
.legal a{color:#000;text-decoration:underline}
.fin{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.fcard{background:linear-gradient(165deg,#fff7e0,#ffe9a8);border:4px solid var(--gold);border-radius:24px;max-width:430px;width:100%;padding:20px 18px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.fcard .tro{font-size:56px;line-height:1}
.fcard .tro .ic{font-size:1em;margin:0}
.ft{font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-size:36px;font-weight:400;margin:6px 0 2px;letter-spacing:1px}
.fw{font-size:24px;margin:4px 0 0}
.fw b{color:#b91c1c}
.fcard .rank{text-align:left;margin:14px 0 10px}
.fl{font-size:15px;margin:6px 0 14px}
.fcard .row{margin:0}
@media(prefers-reduced-motion:reduce){.fcard{animation:none}}

.tagline{font-size:25px;font-weight:800;color:#b91c1c;margin:8px 0 4px;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal.show{display:flex}
#box{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
#opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
</style></head>

let S=null,H=[];
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const $=s=>document.querySelector(s);
const eur=n=>n.toLocaleString("es-ES")+" €";
function big(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  const E=/(\p{Extended_Pictographic}\uFE0F?)/u;
  ns.forEach(n=>{const t=n.nodeValue;if(!E.test(t))return;const f=document.createDocumentFragment();
    t.split(E).forEach(p=>{if(p&&/^\p{Extended_Pictographic}/u.test(p)){const s=document.createElement("span");s.className="ic";s.textContent=p;f.appendChild(s)}else if(p)f.appendChild(document.createTextNode(p))});
    n.parentNode.replaceChild(f,n)})}
const esc=t=>t.replace(/"/g,"&quot;").replace(/</g,"&lt;");
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mut(fn){H.push(JSON.stringify(S));if(H.length>60)H.shift();fn();save();render()}
function undo(){if(!H.length)return;S=JSON.parse(H.pop());save();render()}
function pick(title,opts,html){return new Promise(res=>{
  if(html){$("#mt").innerHTML=title;big($("#mt"))}else $("#mt").textContent=title;const o=$("#opts");o.innerHTML="";
  opts.forEach(x=>{const b=document.createElement("button");b.textContent=x.l;b.onclick=()=>{$("#modal").classList.remove("show");res(x.v)};o.appendChild(b)});
  $("#mc").onclick=()=>{$("#modal").classList.remove("show");res(null)};$("#modal").classList.add("show");o.firstChild&&o.firstChild.focus()})}
function setup(){
  const n=+(window._n||4);
  $("#app").innerHTML=`<div class="setup"><h1>${LG}La Cuenta</h1><p class="hint tagline">¿Quién pagará hoy?</p>
  <label>Participantes</label><div class="r6">${[3,4,5,6,7,8].map(k=>`<button data-k="${k}" class="${k==n?"on":""}">${k}</button>`).join("")}</div>
  <p class="hint">Ahorros iniciales: <b>${eur(AH[n])}</b> por participante.</p>
  ${Array.from({length:n},(_,i)=>`<label>Nombre ${i+1}</label><input type="text" data-n placeholder="Participante ${i+1}">`).join("")}
  <p><button class="pri" id="go" style="width:100%">✅ Empezar partida</button></p></div>`;
  big($("#app"));
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{window._n=+b.dataset.k;setup()});
  $("#go").onclick=()=>{const names=[...document.querySelectorAll("[data-n]")].map((e,i)=>e.value.trim()||"Participante "+(i+1));
    S={round:1,players:names.map(x=>({name:x,money:AH[n],aum:0})),items:[],played:0,wine:0,last:null,starter:null,over:false};H=[];save();render()}}
const total=()=>S.items.reduce((a,x)=>a+x.v,0);
function addTapa(v){mut(()=>{S.items.push({l:v+" €",v,b:v,t:1});S.played++;S.last=S.items.length-1})}
function addWine(){mut(()=>{S.wine++;const n=(S.wine-1)%5+1,v=WT[n]-WT[n-1];S.items.push({l:"Vino +"+v,v});S.played++;S.last=null})}
function quemado(v){mut(()=>{const l="Plato quemado "+(v?"−"+(-v):"0")+" €";S.items.push({l:l.replace("Plato quemado ",""),v,b:v,q:1});S.played++;S.last=S.items.length-1})}
function tarta(){mut(()=>{S.items.push({l:"Tarta 40 €",v:40});S.played++;S.last=null})}
function premium(){const it=typeof S.last==="number"?S.items[S.last]:null;if(!it)return;mut(()=>{const b=it.b!=null?it.b:it.v;it.b=b;it.p=1;it.v=b*2;S.last=null})}
async function propina(){const t=S.items.filter(x=>x.t).map(x=>x.b!=null?x.b:x.v);let v;if(t.length)v=Math.min(...t);else{v=await pick("Propina: no hay tapas apuntadas. ¿Precio de la tapa más barata?",TAPAS.map(x=>({l:x+" €",v:x})));if(v==null)return}mut(()=>{S.items.push({l:"Propina +"+v,v});S.last=null})}
function libre(){const e=$("#fr"),v=parseFloat(e.value);if(isNaN(v))return;mut(()=>{S.items.push({l:(v>0?"+":"")+v+" €",v});S.played++;S.last=null})}
function quitar(){if(!S.items.length)return;mut(()=>{const i=S.items.length-1,it=S.items[i];if(it.p){it.p=0;it.v=it.b;S.last=i}else{S.items.pop();S.last=null}})}
function played(d){mut(()=>{S.played=Math.max(0,S.played+d);S.last=null})}
function aum(i,d){mut(()=>{const p=S.players[i];p.aum=Math.min(5,Math.max(0,p.aum+d))})}
async function pedir(){
  if(S.played<S.players.length){
    const ok=await pick(`<span style="color:#b91c1c">⚠️ ¡Ojo!</span><br><span style="font-size:16px;font-weight:400;display:block;margin:6px 0">Aún no se han jugado tantas cartas como participantes (${S.played}/${S.players.length}). Si pides la cuenta ahora:</span><b style="color:#b91c1c;font-size:18px;display:block">DESCARTAS TU MANO ENTERA Y NO AUMENTAS TU MANO.</b>`,[{l:"🧾 Pedir la cuenta igualmente",v:1}],true);
    if(!ok)return}
  const all=S.players.map((p,i)=>({l:p.name,v:i}));
  const pi=await pick("¿Quién pide la cuenta?",all);if(pi==null)return;
  const mode=await pick("¿Cómo se paga?",[{l:"Paga todo",v:"n"},{l:"A medias",v:"m"},{l:"A pachas",v:"p"}]);if(mode==null)return;
  const bill=Math.max(0,total());let pay=[];
  if(mode=="n")pay=[[pi,bill]];
  if(mode=="m"){const j=await pick("A medias: ¿con quién?",all.filter(x=>x.v!=pi));if(j==null)return;const h=Math.ceil(bill/2);pay=[[pi,h],[j,h]]}
  if(mode=="p"){let ex=[];while(true){const left=all.filter(x=>x.v!=pi&&!ex.includes(x.v));
      const j=await pick("A pachas: ¿quién NO paga (baño o cumpleaños)?",[{l:"Nadie más / listo",v:-1},...left]);
      if(j==null)return;if(j==-1)break;ex.push(j);if(!left.length)break}
    const ids=all.map(x=>x.v).filter(x=>!ex.includes(x)),sh=Math.ceil(bill/ids.length);pay=ids.map(x=>[x,sh])}
  const txt=pay.map(([i,v])=>S.players[i].name+" "+eur(v)).join(", ")||"nadie";
  const ok=await pick("Cuenta de "+eur(bill)+": paga "+txt,[{l:"Confirmar",v:1}]);if(!ok)return;
  mut(()=>{pay.forEach(([i,v])=>{S.players[i].money=Math.max(0,S.players[i].money-v)});
    if(S.played>=S.players.length)S.players[pi].aum=Math.min(5,S.players[pi].aum+1);
    S.items=[];S.played=0;S.wine=0;S.last=null;S.round++;S.starter=pi;
    if(S.players.some(p=>p.money<=0))S.over=true})}

function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40";
  document.body.appendChild(c);const dpr=window.devicePixelRatio||1,W=innerWidth,Hh=innerHeight;
  c.width=W*dpr;c.height=Hh*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const cols=[...COL,"#f5b81c","#ffffff"],P=[];
  const burst=(bx,by,n)=>{for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=5+Math.random()*11;
    P.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v-7,w:6+Math.random()*8,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.5,c:cols[i%cols.length]})}};
  const rain=n=>{for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:-10-Math.random()*60,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]})};
  burst(W/2,Hh*.35,90);
  setTimeout(()=>{burst(W*.15,Hh*.5,60);burst(W*.85,Hh*.5,60)},300);
  setTimeout(()=>burst(W/2,Hh*.3,80),800);
  setTimeout(()=>rain(70),1200);
  const t0=performance.now();
  (function f(){x.clearRect(0,0,W,Hh);
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      if(p.y>Hh+30){P.splice(i,1);continue}
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
    if(P.length||performance.now()-t0<2500)requestAnimationFrame(f);else c.remove()})()}
function showFin(){
  if(!S||document.querySelector(".fin"))return;
  const rank=S.players.map((p,i)=>({...p,i})).sort((a,b)=>b.money-a.money),mx=rank[0].money;
  const win=rank.filter(p=>p.money==mx).map(p=>esc(p.name)).join(" y "),lose=rank.filter(p=>p.money<=0).map(p=>esc(p.name)).join(" y ");
  const d=document.createElement("div");d.className="fin";
  d.innerHTML=`<div class="fcard" role="dialog" aria-modal="true"><div class="tro">🏆</div><h2 class="ft">¡Fin de partida!</h2>
  <p class="fw">Gana <b>${win}</b></p><p>con ${eur(mx)}</p>${rank.filter(p=>p.money==mx).length>1?"<p>Empate: gana quien lleve más dinero encima.</p>":""}
  <div class="rank">${rank.map((p,k)=>`<div><span><i class="dot" style="background:${COL[p.i%8]}"></i>${["🥇","🥈","🥉"][k]||(k+1)+"."} ${esc(p.name)}</span><b class="${p.money<=0?"neg":""}">${eur(p.money)}</b></div>`).join("")}</div>
  <p class="fl">💸 Se han acabado los ahorros de <b>${lose}</b></p>
  <div class="row"><button id="fv">👀 Ver partida</button><button class="pri" id="fn">🆕 Nueva partida</button></div></div>`;
  document.body.appendChild(d);big(d);
  d.querySelector("#fv").onclick=()=>d.remove();
  d.querySelector("#fn").onclick=()=>{d.remove();S=null;H=[];try{localStorage.removeItem(KEY)}catch(e){}render()};
  confetti()}
async function reset(){const r=await pick("¿Empezar una partida nueva? Se borra la actual.",[{l:"Sí, nueva partida",v:1}]);if(r){S=null;H=[];try{localStorage.removeItem(KEY)}catch(e){}render()}}
function render(){
  if(!S)return setup();
  const N=S.players.length,mx=Math.max(...S.players.map(p=>p.money));
  const win=S.players.filter(p=>p.money==mx).map(p=>p.name).join(" y "),lose=S.players.filter(p=>p.money<=0).map(p=>p.name).join(" y ");
  const tie=S.players.filter(p=>p.money==mx).length>1;
  const endBox=S.over?`<div class="end"><h2>🏁 Fin de partida</h2><p>Gana <b>${win}</b> con ${eur(mx)}.</p>${tie?"<p>Empate: gana quien lleve más dinero encima.</p>":""}<p>Se han acabado los ahorros de <b>${lose}</b>.</p><button class="pri" id="vr">🏆 Ver resultados</button></div>`:"";
  const rank=S.players.map((p,i)=>({...p,i})).sort((a,b)=>b.money-a.money);
  const can=S.played>=N;
  $("#app").innerHTML=`<header><div><h1>${LG}La Cuenta</h1><div class="sub">Bar nº ${S.round}${S.starter!=null?" · empieza "+esc(S.players[S.starter].name):""}</div></div>
  <div class="tools"><button class="sec" id="u" ${H.length?"":"disabled"}>↩️ Deshacer</button><button class="sec" id="rs">🆕 Nueva partida</button></div></header>${endBox}
  <div class="bill"><div class="bt"><div class="tot"><small class="tl">🧾 Cuenta del bar</small><div class="num">${eur(total())}</div></div>
  <div class="cw"><div class="cnt"><small class="cl">🃏 Cartas jugadas</small><b class="${can?"ok":""}" style="font-size:22px">${S.played}/${N}</b></div>
  <button id="oc" title="Café, baño, cambio de sentido…">🃏 Otras cartas</button><small class="hn">Café, baño, cambio de sentido…</small></div></div>
  <small class="${can?"go":"nogo"}">${can?"Ya puedes pedir la cuenta y aumentar tu mano.":"Aún no se puede pedir la cuenta a voluntad."}</small>
  <div class="items">${S.items.map(x=>x.p?`<span class="grp">(${x.l} + Premium ×2)</span>`:`<span>${x.q?"Plato quemado "+x.l:x.l}</span>`).join("")}</div>
  <small class="st">🍽️ Tapa (precio de la carta)</small><div class="chips">${TAPAS.map(c=>`<button data-t="${c}">${c}</button>`).join("")}</div>
  <div class="row"><button id="wn" ${S.wine>=10?"disabled":""}>🍷 + Vino (${S.wine}/10)</button><button id="tc">🎂 Tarta 40 €</button><button id="pr" ${typeof S.last==="number"?"":"disabled"}>⭐ Premium ×2</button><button id="pg">💸 Propina</button></div>
  <small class="st">🔥 Plato quemado (resta a la cuenta)</small><div class="chips ch4">${[0,10,20,30,40,50,60,70].map(v=>`<button data-q="${-v}">${v?"−"+v:"0"}</button>`).join("")}</div>
  <button class="pri" id="pd" style="width:100%;margin-top:6px" ${S.items.length||true?"":"disabled"}>🧾 Pedir la cuenta</button></div>
  <div class="grid">${S.players.map((p,i)=>`<div class="p ${S.starter==i?"starter":""}" style="--pc:${COL[i%8]}">
    <input class="name" data-i="${i}" value="${esc(p.name)}" aria-label="Nombre"><small class="dl">💶 Dinero disponible</small>
    <div class="num ${p.money<=0?"neg":""}">${eur(p.money)}</div>
    <div class="mano ${p.aum?"plus":""}"><span class="mn">${5+p.aum}</span><span class="ml">✋ cartas en mano${p.aum?" (+"+p.aum+")":""}</span></div></div>`).join("")}</div>
  <section><h2>🏆 Clasificación</h2><div class="rank">${rank.map((p,k)=>`<div><span><i class="dot" style="background:${COL[p.i%8]}"></i>${["🥇","🥈","🥉"][k]||(k+1)+"."} ${esc(p.name)}</span><b class="${p.money<=0?"neg":""}">${eur(p.money)}</b></div>`).join("")}</div></section>`;
  big($("#app"));
  if(S.over){document.querySelectorAll(".bill button,.bill input").forEach(b=>b.disabled=true);if(!S.shown){S.shown=true;save();setTimeout(showFin,200)}}
  $("#u").onclick=undo;if($("#vr"))$("#vr").onclick=showFin;$("#rs").onclick=reset;$("#oc").onclick=()=>played(1);
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>addTapa(+b.dataset.t));
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>quemado(+b.dataset.q));
  $("#tc").onclick=tarta;$("#wn").onclick=addWine;$("#pr").onclick=premium;$("#pg").onclick=propina;$("#pd").onclick=pedir;
  document.querySelectorAll("input.name").forEach(e=>e.onchange=()=>{S.players[+e.dataset.i].name=e.value.trim()||"Participante";save();render()})}
render();
</script></body></html>
